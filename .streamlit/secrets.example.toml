# Copy these values into Streamlit Community Cloud secrets.
# Do not commit a real `.streamlit/secrets.toml` file.

# Recommended: host the smaller prepared Parquet cache somewhere private or signed.
DASHBOARD_CACHE_URL = "https://example.com/dashboard_cache.parquet"

# Optional: use the SQLite database instead if you prefer.
# DASHBOARD_DB_URL = "https://example.com/dashboard.sqlite"

# Optional: only needed if your host expects an Authorization: Bearer token header.
# DASHBOARD_DATA_TOKEN = "replace-with-private-token"
